

<div class="home">
    <div class="home-image">
        <h1>Eventi Lombardia</h1>
        <p>La tua guida per il territorio</p>

    </div>

    <div class="container">
        


<div class="search">
  <h2 class="search__title">Scopri i nostri eventi</h2>
  <div class="search__container">
    <input type="text" class="search__input" placeholder="Filtra eventi...">
    <button class="search__button">
      <svg class="search__icon" aria-hidden="true" viewBox="0 0 24 24">
        <g>
          <path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"></path>
        </g>
      </svg>
    </button>
  </div>
</div>





        <div class="container-events">
            <a *ngFor="let event of events" class="event-card">
                <div class="event-image">
                    <img [src]="'https://picsum.photos/400/200'" alt="{{ event.title }}" />
                </div>
                <div class="event-details">
                    <h3>{{ event.title }}</h3>
                    <p>{{ event.description }}</p>
                </div>
            </a>
        </div>
    </div>
</div>
