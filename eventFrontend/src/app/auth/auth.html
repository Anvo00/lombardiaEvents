<div class="auth_container">
    <div class="auth_form">
        <div class="auth_form_box" [ngClass]="{'disabled': registerFormActive}">
            <h1>Bentornato!</h1>
            <p>Inserisci i dati del tuo account per accedere</p>
            <form>
                <input type="text" placeholder="Nome utente" #usernameLogin>
                <input type="password" placeholder="Password" #passwordLogin>
                <button type="button" class="button" (click)="loginUser(usernameLogin.value, passwordLogin.value)">Accedi</button>
                <hr>
                <p class="little-text">Sei un nuovo utente?</p>
                <button type="button" class="secondary-button" (click)="onRegisterClick()">Registrati</button>
            </form>
        </div>

        <div class="auth_form_box" [ngClass]="{'disabled': !registerFormActive}">
            <h1>Benvenuto!</h1>
            <p>Registrati inserendo i tuoi dati personali</p>
            <form>
                <input type="text" placeholder="Nome" #nome>
                <input type="text" placeholder="Cognome" #cognome>
                <input type="text" placeholder="Nome utente" #username>
                <input type="email" placeholder="Email" #email>
                <input type="password" placeholder="Password" #password>
                <button type="button" class="button" (click)="registerUser(nome.value, cognome.value, username.value, email.value, password.value)">Registrati</button>
                <hr>
                <p class="little-text">Hai già un account?</p>
                <button type="button" class="secondary-button" (click)="onLoginClick()">Accedi</button>
              </form>
        </div>
        <div class="auth_hero"></div>
    </div>
</div>
<app-footer></app-footer>
