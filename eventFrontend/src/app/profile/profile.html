<div class="profile-container">
  <div class="profile-card">

    <h1>Il mio profilo</h1>

    <div *ngIf="!editing" class="view-mode">
      <p><strong>Nome:</strong> {{ user.firstName }}</p>
      <p><strong>Cognome:</strong> {{ user.lastName }}</p>
      <p><strong>Nome utente:</strong> {{ user.username }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Password:</strong> {{ user.password }}</p> <!-- forse non è il caso -->

      <button class="btn" (click)="startEditing()">Cambia informazioni</button>

      <hr class="divider" />

      <h2>I miei eventi</h2>
      <div class="container-events">
        <a *ngFor="let event of events" class="event-card">
          <div class="event-image">
            <img [src]="'https://picsum.photos/400/200'" alt="{{ event.title }}" />
          </div>
          <div class="event-details">
            <h3>{{ event.title }}</h3>
            <p>{{ event.description }}</p>
          </div>
        </a>
      </div>
    </div>

    <!--parte per edit profilo-->
    <div *ngIf="editing" class="edit-mode">
      <form (ngSubmit)="saveChanges()" #profileForm="ngForm">
        <label>
          Nome:
          <input type="text" [(ngModel)]="formUser.firstName" name="firstName" required />
        </label>
        <label>
          Cognome:
          <input type="text" [(ngModel)]="formUser.lastName" name="lastName" required />
        </label>
        <label>
          Nome utente:
          <input type="text" [(ngModel)]="formUser.username" name="username" required />
        </label>
        <label>
          Email:
          <input type="email" [(ngModel)]="formUser.email" name="email" required />
        </label>
        <label>
          Password:
          <input type="password" [(ngModel)]="formUser.password" name="password" required />
        </label>

        <div class="buttons">
          <button type="submit" class="btn">Aggiorna</button>
          <button type="button" class="btn btn-secondary" (click)="cancelEditing()">Annulla</button>
        </div>
      </form>
    </div>

  </div>
</div>
