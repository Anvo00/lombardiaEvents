<div class="pass-container">
  <div class="pass-card">
    <h1>Modifica la password</h1>

    <div class="edit-mode">
      <form (ngSubmit)="saveChanges(password.value, password2.value)" #passwordForm="ngForm">

        <label>
          Nuova password:
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" #password class="password-input"/>
            <button type="button" class="toggle-password"
                    (click)="showPassword = !showPassword"
                    tabindex="-1">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </label>

        <label>
          Ripeti password:
          <div class="password-wrapper">
            <input [type]="showPasswordRepeat ? 'text' : 'password'" #password2 class="password-input"/>
            <button type="button" class="toggle-password"
                    (click)="showPasswordRepeat = !showPasswordRepeat"
                    tabindex="-1">
              <i class="bi" [ngClass]="showPasswordRepeat ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </label>

        <div class="buttons">
          <button type="submit" class="btn">Aggiorna password</button>
          <button type="button" class="btnsec" (click)="cancelEditing()">Annulla</button>
        </div>

      </form>
    </div>
  </div>
</div>
