<div class="pass-container">
  <div class="pass-card">

    <h1>Modifica la password</h1>

    <!-- EDIT PROFILE -->

    <div class="edit-mode">
      <form (ngSubmit)="saveChanges(password.value, password2.value)" #passwordForm="ngForm">
        <label>
          Nuova password:
          <div class="wrapper">
          <input [type]="showPassword ? 'text' : 'password'" #password />
          <button type="button" (click)="showPassword = !showPassword">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
          </div>
        </label>
        <label>
          Ripeti password:
          <div class="wrapper">
          <input [type]="showPassword ? 'text' : 'password'" #password2 />
          <button type="button" (click)="showPassword = !showPassword">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
          </div>
        </label>

        <div class="buttons">
          <button type="button" class="btn btn-secondary" (click)="cancelEditing()">Annulla</button>
          <button type="submit" class="btn">Aggiorna password</button>
        </div>
      </form>
    </div>
  </div>
</div>
