<div class="pass-container">
  <div class="pass-card">

    <h1>Modifica la password</h1>

    <!-- EDIT PROFILE -->

    <div class="edit-mode">
      <form (ngSubmit)="saveChanges(password.value, password2.value)" #passwordForm="ngForm">
        <label>
          Nuova password:
          <input type="password" #password/>
        </label>
        <label>
          Ripeti password:
          <input type="password" #password2/>
        </label>

        <div class="buttons">
          <button type="button" class="btn btn-secondary" (click)="cancelEditing()">Annulla</button>
          <button type="submit" class="btn">Aggiorna password</button>
        </div>
      </form>
    </div>
  </div>
</div>
