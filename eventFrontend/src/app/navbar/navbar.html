<nav class="navbar" [ngClass]="{'active': navbarOpen}">
  <div class="navbar-toggle">
    <button (click)="toggleNavbar()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
      </svg>
    </button>
  </div>

  
  <div class="navbar-content" [ngClass]="{'active': navbarOpen}">
    <a routerLink="/home">Home</a>

    <!-- NOT LOGGED IN -->

    <button class="login-button" *ngIf="!isAuthenticated" routerLink="/auth">Accedi</button>

    <!-- LOGGED IN -->

    <div class="right" *ngIf="isAuthenticated">
      <a routerLink="/profile">Profilo</a>
      <button class="login-button" (click)="logout()">Log Out</button>
    </div>
  </div>
</nav>
